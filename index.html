var todayStr=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var monthKey=function(d){return d.slice(0,7)};
var monthLabel=function(mk){var p=mk.split("-");return MONTHS[parseInt(p[1])-1]+" "+p[0]};
var monthsBetween=function(mkA,mkB){var pa=mkA.split("-"),pb=mkB.split("-");return (parseInt(pb[0])-parseInt(pa[0]))*12+(parseInt(pb[1])-parseInt(pa[1]))};
var normalizeTarjetas=function(arr){
  if(!arr)return null;
  return arr.map(function(t){
    if(typeof t==="string")return{nombre:t,cierre:1};
    return{nombre:t.nombre,cierre:parseInt(t.cierre)||1};
  });
};
var lastDayOfMonth=function(year,month){return new Date(year,month+1,0).getDate()};
// Dada la fecha de compra y el día de cierre de la tarjeta, calcula en qué mes cae la primera cuota:
// si la compra es antes o el día de cierre, entra en el resumen de ese mes; si es después, pasa al mes siguiente.
var calcularPrimeraCuota=function(fechaCompraStr, cierreDia){
  var d=new Date(fechaCompraStr+"T12:00:00");
  var year=d.getFullYear(), month=d.getMonth(), day=d.getDate();
  var cierre=parseInt(cierreDia)||1;
  if(day>cierre){month+=1; if(month>11){month=0;year+=1}}
  var finalDay=Math.min(cierre,lastDayOfMonth(year,month));
  return year+"-"+String(month+1).padStart(2,"0")+"-"+String(finalDay).padStart(2,"0");
};
var RUBRO_TC="Tarjeta de crédito";
var TIPOS_ITEM=["consumo","cuota","fijo","impuesto","interes","pago","otro"];
var TIPO_LABEL={consumo:"Consumos",cuota:"Cuotas",fijo:"Fijos / débitos",impuesto:"Impuestos",interes:"Intereses y cargos",pago:"Pagos / saldo anterior",otro:"Otros"};
var normTxt=function(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()};
var addMonths=function(mk,n){var p=mk.split("-");var d=new Date(parseInt(p[0]),parseInt(p[1])-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
// Resumen (mes de cierre) que cubre un pago: el último cierre anterior a la fecha del pago.
var periodoPagado=function(fechaPagoStr,cierreDia){
  var d=new Date(fechaPagoStr+"T12:00:00");
  var mk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  return d.getDate()<=(parseInt(cierreDia)||1)?addMonths(mk,-1):mk;
};
// Para pagos viejos cargados sin tarjeta: deduce la tarjeta por la descripción ("Naranja Tomás", "Amex macro"...).
var detectarTarjeta=function(desc,tarjetas){
  var nd=normTxt(desc), ndJunto=nd.replace(/\s/g,"");
  var mejor=null, mejorScore=0, empate=false;
  tarjetas.forEach(function(t){
    var nt=normTxt(t.nombre);
    var score=nt.split(/\s+/).filter(function(w){return w.length>=4&&w!=="tarjeta"&&ndJunto.indexOf(w)>=0}).length;
    if(nt.indexOf("american")>=0&&nd.indexOf("amex")>=0)score++;
    if(score>mejorScore){mejor=t.nombre;mejorScore=score;empate=false}
    else if(score>0&&score===mejorScore){empate=true}
  });
  return mejorScore>0&&!empate?mejor:null;
};
var resumenId=function(tarjeta,periodo){return normTxt(tarjeta).replace(/[^a-z0-9]+/g,"_")+"_"+periodo};
var fileToBase64=function(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){resolve(String(r.result).split(",")[1])};
    r.onerror=reject;
    r.readAsDataURL(file);
  });
};

function Root(){
  var[authState,setAuthState]=useState("loading");
  var[user,setUser]=useState(null);
  var[authError,setAuthError]=useState("");
  var[denied,setDenied]=useState(false);

  useEffect(function(){
    firebase.auth().getRedirectResult().catch(function(e){
      console.error("Redirect result error:",e);
      if(e.code!=="auth/popup-closed-by-user")setAuthError("("+e.code+") "+e.message);
    });
    var unsub=firebase.auth().onAuthStateChanged(function(u){
      setUser(u);
      setAuthState(u?"in":"out");
      if(u)setDenied(false);
    });
    return unsub;
  },[]);

  var signIn=function(){
    setAuthError("");
    firebase.auth().signInWithPopup(googleProvider).catch(function(e){
      console.error("signInWithPopup error:",e);
      if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){
        setAuthError("("+e.code+") "+e.message);
      }
    });
  };
  var signOut=function(){firebase.auth().signOut()};

  if(authState==="loading")return null;
  if(authState==="out")return <LoginScreen onSignIn={signIn} error={authError}/>;
  if(denied)return <AccessDenied email={user.email} onSignOut={signOut}/>;
  return <App user={user} onSignOut={signOut} onAccessDenied={function(){setDenied(true)}}/>;
}

  // Firebase real-time listeners
  useEffect(function(){
    // Config doc (rubros + members)
    var unsubConfig = db.collection("casabalance").doc("config").onSnapshot(function(doc){
      if(doc.exists){

  // Cuotas expansion
  var gastosExpandidos=useMemo(function(){
    var all=[];
    gastos.forEach(function(g){
      var cuotas=parseInt(g.cuotas)||1;
      var montoCuota=g.monto/cuotas;
      for(var i=0;i<cuotas;i++){
        var d=new Date(g.fecha+"T12:00:00");
        d.setMonth(d.getMonth()+i);
        var mk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
        all.push(Object.assign({},g,{monto:montoCuota,mes:mk,cuotaNum:i+1,cuotasTotal:cuotas,esOriginal:i===0}));

    });

  var totalGastosMes=gastosMes.reduce(function(s,g){return s+g.monto},0);

  var balanceMes=totalIngresosMes-totalGastosMes;

  // Los pagos de tarjeta con resumen conciliado se reparten entre los rubros reales de sus líneas,
  // proporcional al monto pagado (así un pago parcial no infla nada). Sin resumen quedan como "sin detalle".
  var gastosPorRubro=useMemo(function(){
    var map={};
    var sumar=function(r,v){map[r]=(map[r]||0)+v};
    gastosMes.forEach(function(g){
      if(g.rubro!==RUBRO_TC){sumar(g.rubro,g.monto);return}
      var t=g.tarjeta||detectarTarjeta(g.desc,tarjetas);
      var cierre=(tarjetas.find(function(x){return x.nombre===t})||{}).cierre;
      var periodo=g.periodo||(t&&cierre?periodoPagado(g.fecha,cierre):null);
      var res=t&&periodo?resumenes[resumenId(t,periodo)]:null;
      var lineas=res?(res.items||[]).filter(function(it){return it.moneda==="ARS"&&it.tipo!=="pago"&&it.monto>0}):[];
      var totalLineas=lineas.reduce(function(s,it){return s+it.monto},0);
      if(totalLineas<=0){sumar(RUBRO_TC+" (sin detalle)",g.monto);return}
      lineas.forEach(function(it){
        var r=it.tipo==="impuesto"||it.tipo==="interes"?"Impuestos e intereses tarjeta":it.rubro;
        sumar(r,g.monto*it.monto/totalLineas);
      });
    });
    return Object.entries(map).sort(function(a,b){return b[1]-a[1]});
  },[gastosMes,tarjetas,resumenes]);

  // Arma la pantalla de revisión a partir de lo que devolvió la IA, para una tarjeta dada
  var armarRevision=function(r,tarjeta,archivo,periodoDefault){
    // El período es el mes de la fecha de cierre impresa en el resumen (si se pudo leer)
    var periodo=/^\d{4}-\d{2}-\d{2}$/.test(r.fecha_cierre)?r.fecha_cierre.slice(0,7):periodoDefault;
    var items=r.items.map(function(it,idx){
      var match=null;
      if(it.tipo==="cuota"&&it.cuotas_total>1){
        match=comprasExpandidas.find(function(c){
          return c.tarjeta===tarjeta&&c.mes===periodo&&c.cuotasTotal===it.cuotas_total&&c.cuotaNum===it.cuota_numero&&Math.abs(c.monto-it.monto)<=Math.max(it.monto*0.15,1000);
        })||null;
      }
      return Object.assign({},it,{
        key:idx,
        rubro:rubros.indexOf(it.rubro)>=0?it.rubro:"Otros",
        compraExistente:match?match.desc:null,
        agregarCompra:it.tipo==="cuota"&&it.cuotas_total>1&&!match&&it.moneda==="ARS"
      });
    });
    return {tarjeta:tarjeta,periodo:periodo,cierre:r.fecha_cierre,vencimiento:r.fecha_vencimiento,
      total:r.total_ars,totalUSD:r.total_usd,notas:r.notas,archivo:archivo,items:items,raw:r,periodoDefault:periodoDefault};
  };

  var onPdfElegido=function(e){
    var files=Array.from(e.target.files||[]);
    var destino=pdfDestinoRef.current||{};
    if(files.length===0)return;
    var nombresTarjetas=tarjetas.filter(function(t){return t.nombre!=="Sin asignar"}).map(function(t){return t.nombre});
    var fn=firebase.app().functions("us-central1").httpsCallable("extraerResumen",{timeout:300000});
    files.forEach(function(file){
      var id=uid();
      if(file.size>8*1024*1024){
        setCola(function(c){return c.concat([{id:id,archivo:file.name,estado:"error",error:"El PDF pesa más de 8 MB."}])});
        return;
      }
      setCola(function(c){return c.concat([{id:id,archivo:file.name,estado:"leyendo",inicio:Date.now()}])});
      // Todos los PDF se leen en paralelo
      fileToBase64(file).then(function(b64){
        return fn({pdf:b64,tarjeta:destino.tarjeta||null,tarjetas:nombresTarjetas,rubros:rubros});
      }).then(function(res){
        var r=res.data;
        var t=destino.tarjeta||(nombresTarjetas.indexOf(r.tarjeta_detectada)>=0?r.tarjeta_detectada:"");
        actualizarCola(id,{estado:"listo",data:r,tarjeta:t,periodoDefault:destino.periodo||selMonthTarjeta});
      }).catch(function(err){
        console.error("extraerResumen error:",err);
        actualizarCola(id,{estado:"error",error:err.message||String(err)});
      });
    });
  };

  var guardarRevision=function(){
    var r=revision;
    var cierreTarjeta=(tarjetas.find(function(t){return t.nombre===r.tarjeta})||{}).cierre||1;
    var batch=db.batch();
    var base=db.collection("casabalance").doc("data");
    var items=r.items.map(function(it){
      return {fecha:it.fecha,desc:it.desc,monto:it.monto,moneda:it.moneda,tipo:it.tipo,rubro:it.rubro,
        cuota_numero:it.cuota_numero,cuotas_total:it.cuotas_total,titular:it.titular};
    });
    batch.set(base.collection("resumenes").doc(resumenId(r.tarjeta,r.periodo)),{
      tarjeta:r.tarjeta,periodo:r.periodo,cierre:r.cierre,vencimiento:r.vencimiento,
      total:r.total,totalUSD:r.totalUSD,archivo:r.archivo,items:items,
      cargado:firebase.firestore.FieldValue.serverTimestamp()
    });
    // Compras en cuotas que figuran en el resumen pero nunca se cargaron en la app
    r.items.filter(function(it){return it.agregarCompra}).forEach(function(it){
      var primerMes=addMonths(r.periodo,-(it.cuota_numero-1));
      var p=primerMes.split("-");
      var dia=Math.min(cierreTarjeta,lastDayOfMonth(parseInt(p[0]),parseInt(p[1])-1));
      batch.set(base.collection("tarjetaCompras").doc(),{
        desc:it.desc,monto:Math.round(it.monto*it.cuotas_total),tarjeta:r.tarjeta,cuotas:it.cuotas_total,
        fechaCompra:/^\d{4}-\d{2}-\d{2}$/.test(it.fecha)?it.fecha:primerMes+"-01",
        fecha:primerMes+"-"+String(dia).padStart(2,"0"),rubro:it.rubro,origen:"resumen"
      });
    });
    batch.commit().then(function(){setRevision(null)}).catch(function(e){
      console.error("Error guardando resumen:",e);
      alert("No se pudo guardar el resumen: "+e.message);
    });
  };

  var borrarResumen=function(res){
    if(confirm("¿Eliminar el resumen de "+res.tarjeta+" — "+monthLabel(res.periodo)+"? (Las compras en cuotas que agregó no se borran.)")){
      db.collection("casabalance").doc("data").collection("resumenes").doc(res.id).delete()
        .catch(function(e){console.error(e)});
      setVerResumen(null);
    }
  };

  var openAddIngreso=function(){resetIngresoForm();setShowIngreso(true)};
  var openEditIngreso=function(ing){setEditIngreso(ing);setIDesc(ing.desc);setIMonto(String(ing.monto));setIMember(ing.member);setIFecha(ing.fecha);setShowIngreso(true)};

  var openAddAhorro=function(){resetAhorroForm();setShowAhorro(true)};
  var openEditAhorro=function(a){setEditAhorro(a);setADesc(a.desc);setAMonto(String(a.monto));setAUbicacion(a.ubicacion||"Banco");setAFecha(a.fecha);setShowAhorro(true)};

  var[filtroRubro,setFiltroRubro]=useState("");

  var openAddGastoUSD=function(){resetGastoUSDForm();setShowGastoUSD(true)};
  var openEditGastoUSD=function(g){setEditGastoUSD(g);setGuDesc(g.desc);setGuMonto(String(g.monto));setGuRubro(g.rubro);setGuFecha(g.fecha);setShowGastoUSD(true)};

  // Rubros
  var[newRubro,setNewRubro]=useState("");
  var addRubro=function(){
    if(newRubro.trim()&&!rubros.includes(newRubro.trim())){
      var nr=rubros.concat([newRubro.trim()]);
      setRubros(nr);
      saveConfig(nr,null);
      setNewRubro("");
    }
  };
  var removeRubro=function(r){
    var nr=rubros.filter(function(x){return x!==r});
    setRubros(nr);
    saveConfig(nr,null);
  };

  // Members
  var[newMember,setNewMember]=useState("");
  var addMember=function(){
    if(newMember.trim()&&!members.includes(newMember.trim())){
      var nm=members.concat([newMember.trim()]);
      setMembers(nm);
      saveConfig(null,nm);
      setNewMember("");
    }
  };
  var removeMember=function(m){
    var nm=members.filter(function(x){return x!==m});
    setMembers(nm);
    saveConfig(null,nm);
  };

  // Tarjetas de crédito
  var[newTarjeta,setNewTarjeta]=useState("");
  var[newTarjetaCierre,setNewTarjetaCierre]=useState("");
  var addTarjeta=function(){
    var nombre=newTarjeta.trim();
    var cierre=parseInt(newTarjetaCierre);
    if(nombre && cierre>=1 && cierre<=31 && !tarjetas.some(function(t){return t.nombre===nombre})){
      var nt=tarjetas.concat([{nombre:nombre,cierre:cierre}]);
      setTarjetas(nt);
      saveConfig(null,null,nt);
      setNewTarjeta("");
      setNewTarjetaCierre("");
    }
  };
  var removeTarjeta=function(nombre){
    var nt=tarjetas.filter(function(x){return x.nombre!==nombre});
    setTarjetas(nt);
    saveConfig(null,null,nt);
  };

  var totalAhorrosUSD=useMemo(function(){return ahorros.reduce(function(s,a){return s+a.monto},0)},[ahorros]);
  var ahorrosBanco=useMemo(function(){return ahorros.filter(function(a){return a.ubicacion==="Banco"}).reduce(function(s,a){return s+a.monto},0)},[ahorros]);
  var ahorrosCaja=useMemo(function(){return ahorros.filter(function(a){return a.ubicacion==="Caja de Seguridad"}).reduce(function(s,a){return s+a.monto},0)},[ahorros]);

  var totalGastosUSD=useMemo(function(){return gastosUSD.reduce(function(s,g){return s+g.monto},0)},[gastosUSD]);
  var balanceNetoUSD=totalAhorrosUSD-totalGastosUSD;
  var gastosPorRubroUSD=useMemo(function(){
    var map={};
    gastosUSD.forEach(function(g){map[g.rubro]=(map[g.rubro]||0)+g.monto});
    return Object.entries(map).sort(function(a,b){return b[1]-a[1]});
  },[gastosUSD]);

  var ingresosPorMiembro=useMemo(function(){
    var map={};
    ingresosMes.forEach(function(i){map[i.member]=(map[i.member]||0)+i.monto});
    return Object.entries(map).sort(function(a,b){return b[1]-a[1]});
  },[ingresosMes]);

  var ttStyle={contentStyle:{background:"#1a1d27",border:"1px solid #2a2d3a",borderRadius:10,fontSize:13,color:"#e8eaed"},itemStyle:{color:"#e8eaed"}};

  return (
    <div>
      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#1a1d27 0%,#0f1117 100%)",borderBottom:"1px solid #2a2d3a",padding:"16px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:38,height:38,borderRadius:10,background:"linear-gradient(135deg,#2dd4bf,#818cf8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>💰</div>
          <div>
            <div style={{fontFamily:"'Space Mono',monospace",fontSize:18,fontWeight:700,letterSpacing:-0.5}}>CasaBalance</div>
            <div style={{fontSize:11,color:"#6b7280",display:"flex",alignItems:"center",gap:4}}>
              <span className={online?"online-dot on":"online-dot off"}></span>
              <span>{online?"Online":"Offline"}</span>
              <span style={{marginLeft:8}}>Control de gastos familiar</span>
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          {canInstall && !isStandalone && <PrimaryBtn onClick={installApp} style={{padding:"9px 16px"}}>📲 Instalar app</PrimaryBtn>}
          {isIOS && !isStandalone && !canInstall && <span style={{fontSize:11,color:"#6b7280",maxWidth:160}}>Para instalar: Compartir ⬆️ → Agregar a inicio</span>}
          <SecondaryBtn onClick={function(){setShowRubros(true)}}>✎ Rubros</SecondaryBtn>
          <SecondaryBtn onClick={function(){setShowMembers(true)}}>✎ Miembros</SecondaryBtn>
          <span style={{fontSize:11,color:"#6b7280",marginLeft:4}}>{props.user&&props.user.email}</span>
          <SecondaryBtn onClick={props.onSignOut}>Salir</SecondaryBtn>
        </div>
      </div>

      {/* MONTH + TABS */}
      <div style={{padding:"16px 24px 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:"#6b7280"}}>Período:</span>
          <SelectInput value={selMonth} onChange={setSelMonth} options={availableMonths} style={{minWidth:140}}/>
          <span style={{fontSize:20,fontWeight:700,marginLeft:8}}>{monthLabel(selMonth)}</span>
        </div>
        <Tabs tabs={["Dashboard","Gastos","Ingresos","Tarjetas","Panel USD"]} active={tab} onChange={setTab}/>
      </div>

      <div style={{padding:"0 24px 40px"}}>

      {/* DASHBOARD */}
      {tab==="Dashboard" && <div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:20}}>
          <StatCard label="Ingresos" value={fmt(totalIngresosMes)} color="#4ade80"/>
          <StatCard label="Gastos" value={fmt(totalGastosMes)} color="#f87171"/>
          <StatCard label="Balance" value={fmt(balanceMes)} color={balanceMes>=0?"#4ade80":"#f87171"} sub={balanceMes>=0?"Superávit":"Déficit"}/>
          <StatCard label="Nº Gastos" value={gastosMes.length} sub={"en "+monthLabel(selMonth)}/>
          <StatCard label="Ahorros USD" value={fmtUSD(totalAhorrosUSD)} color="#facc15" sub={"Banco: "+fmtUSD(ahorrosBanco)+" · Caja: "+fmtUSD(ahorrosCaja)}/>
          <StatCard label="Gastos USD" value={fmtUSD(totalGastosUSD)} color="#fb923c" sub={gastosUSD.length+" operaciones"}/>
          <StatCard label="Saldo Neto USD" value={fmtUSD(balanceNetoUSD)} color={balanceNetoUSD>=0?"#4ade80":"#f87171"} sub={balanceNetoUSD>=0?"Positivo":"Negativo"}/>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:14,marginBottom:20}}>
          <Card>
            <h4 style={{margin:"0 0 12px",fontSize:14,color:"#6b7280"}}>Gastos por Rubro</h4>
            {gastosPorRubro.length===0
              ? <div style={{color:"#6b7280",fontSize:13,padding:20,textAlign:"center"}}>Sin datos</div>
              : <ResponsiveContainer width="100%" height={250}>
                  <PieChart>
                    <Pie data={gastosPorRubro.map(function(r){return{name:r[0],value:r[1]}})} cx="50%" cy="50%" outerRadius={90} innerRadius={50} dataKey="value" paddingAngle={2}
                      label={function(p){return p.name+" "+Math.round(p.percent*100)+"%"}} style={{fontSize:11}}>
                      {gastosPorRubro.map(function(_,i){return <Cell key={i} fill={COLORS[i%COLORS.length]}/>})}
                    </Pie>
                    <Tooltip formatter={function(v){return fmt(v)}} {...ttStyle}/>
                  </PieChart>
                </ResponsiveContainer>
            }
          </Card>

          <Card>
            <h4 style={{margin:"0 0 12px",fontSize:14,color:"#6b7280"}}>Gastos por Medio de Pago</h4>
            {gastosPorMetodo.length===0
              ? <div style={{color:"#6b7280",fontSize:13,padding:20,textAlign:"center"}}>Sin datos</div>
              : <ResponsiveContainer width="100%" height={250}>
                  <PieChart>
                    <Pie data={gastosPorMetodo.map(function(r){return{name:r[0],value:r[1]}})} cx="50%" cy="50%" outerRadius={90} innerRadius={50} dataKey="value" paddingAngle={2}
                      label={function(p){return p.name+" "+Math.round(p.percent*100)+"%"}} style={{fontSize:11}}>
                      {gastosPorMetodo.map(function(_,i){return <Cell key={i} fill={["#2dd4bf","#818cf8","#f472b6"][i]||COLORS[i]}/>})}
                    </Pie>
                    <Tooltip formatter={function(v){return fmt(v)}} {...ttStyle}/>
                  </PieChart>
                </ResponsiveContainer>
            }
          </Card>
        </div>

        <Card style={{marginBottom:20}}>
          <h4 style={{margin:"0 0 12px",fontSize:14,color:"#6b7280"}}>Evolución Mensual — Ingresos vs Gastos (12 meses)</h4>
          <ResponsiveContainer width="100%" height={300}>
            <BarChart data={evolucion} barGap={2}>
              <XAxis dataKey="mes" tick={{fill:"#6b7280",fontSize:11}} axisLine={{stroke:"#2a2d3a"}} tickLine={false}/>
              <YAxis tick={{fill:"#6b7280",fontSize:11}} axisLine={{stroke:"#2a2d3a"}} tickLine={false} tickFormatter={function(v){return v>=1000?(v/1000).toFixed(0)+"k":v}}/>
              <Tooltip formatter={function(v){return fmt(v)}} {...ttStyle}/>
              <Legend wrapperStyle={{fontSize:12}}/>
              <Bar dataKey="ingresos" name="Ingresos" fill="#4ade80" radius={[4,4,0,0]}/>
              <Bar dataKey="gastos" name="Gastos" fill="#f87171" radius={[4,4,0,0]}/>
            </BarChart>
          </ResponsiveContainer>
        </Card>

        <Card style={{marginBottom:20}}>
          <h4 style={{margin:"0 0 12px",fontSize:14,color:"#6b7280"}}>Balance Mensual</h4>
          <ResponsiveContainer width="100%" height={220}>
            <LineChart data={evolucion}>
              <XAxis dataKey="mes" tick={{fill:"#6b7280",fontSize:11}} axisLine={{stroke:"#2a2d3a"}} tickLine={false}/>
              <YAxis tick={{fill:"#6b7280",fontSize:11}} axisLine={{stroke:"#2a2d3a"}} tickLine={false} tickFormatter={function(v){return v>=1000?(v/1000).toFixed(0)+"k":v}}/>
              <Tooltip formatter={function(v){return fmt(v)}} {...ttStyle}/>
              <Line type="monotone" dataKey="balance" name="Balance" stroke="#2dd4bf" strokeWidth={2.5} dot={{r:4,fill:"#2dd4bf"}}/>
            </LineChart>
          </ResponsiveContainer>
        </Card>

        {ingresosPorMiembro.length>0 && <Card>
          <h4 style={{margin:"0 0 12px",fontSize:14,color:"#6b7280"}}>Aportes por Miembro — {monthLabel(selMonth)}</h4>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {ingresosPorMiembro.map(function(entry){
              var m=entry[0], v=entry[1];
              var pct=totalIngresosMes>0?(v/totalIngresosMes*100):0;
              return <div key={m}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span>{m}</span><span style={{fontWeight:600}}>{fmt(v)} ({pct.toFixed(0)}%)</span></div>
                <div style={{height:8,borderRadius:4,background:"#2a2d3a",overflow:"hidden"}}>
                  <div style={{width:pct+"%",height:"100%",background:"#4ade80",borderRadius:4,transition:"width .5s"}}/>
                </div>
              </div>;
            })}
          </div>
        </Card>}
      </div>}

      {/* GASTOS */}
      {tab==="Gastos" && function(){
        var rubrosEnMes=Array.from(new Set(gastosMes.map(function(g){return g.rubro}))).sort();
        var gastosFiltrados=gastosMes
          .filter(function(g){return !filtroRubro||g.rubro===filtroRubro})
          .slice().sort(function(a,b){return b.fecha.localeCompare(a.fecha)});
        var totalFiltrado=gastosFiltrados.reduce(function(s,g){return s+g.monto},0);
        return <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <h3 style={{margin:0,fontSize:16}}>Gastos — {monthLabel(selMonth)}</h3>
            <PrimaryBtn onClick={openAddGasto}>+ Nuevo Gasto</PrimaryBtn>
          </div>

          {/* Filtro por rubro */}
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,flexWrap:"wrap"}}>
            <span style={{fontSize:13,color:"#6b7280"}}>Filtrar por rubro:</span>
            <select value={filtroRubro} onChange={function(e){setFiltroRubro(e.target.value)}}
              style={{padding:"8px 12px",borderRadius:8,border:"1px solid "+(filtroRubro?"#2dd4bf":"#2a2d3a"),background:"#22252f",color:filtroRubro?"#2dd4bf":"#e8eaed",fontSize:13,cursor:"pointer"}}>
              <option value="">Todos los rubros</option>
              {rubrosEnMes.map(function(r){return <option key={r} value={r}>{r}</option>})}
            </select>
            {filtroRubro && <button onClick={function(){setFiltroRubro("")}}
              style={{padding:"7px 12px",borderRadius:8,border:"1px solid #2a2d3a",background:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>✕ Limpiar</button>}
            {filtroRubro && <span style={{fontSize:13,color:"#6b7280"}}>{gastosFiltrados.length} resultado{gastosFiltrados.length!==1?"s":""}</span>}
          </div>

          {gastosMes.length===0
            ? <Card><div style={{textAlign:"center",color:"#6b7280",padding:30}}>No hay gastos registrados para este mes.</div></Card>
            : gastosFiltrados.length===0
              ? <Card><div style={{textAlign:"center",color:"#6b7280",padding:30}}>No hay gastos del rubro "{filtroRubro}" este mes.</div></Card>
              : <div style={{overflowX:"auto"}}>
                  <table>
                    <thead><tr>
                      <th>Fecha</th><th>Descripción</th><th>Rubro</th><th>Medio</th><th style={{textAlign:"right"}}>Monto</th><th style={{textAlign:"center"}}>Acciones</th>
                    </tr></thead>
                    <tbody>
                      {gastosFiltrados.map(function(g,i){
                        return <tr key={g.id+"-"+g.cuotaNum} style={{background:i%2===0?"#1a1d27":"transparent"}}>
                          <td style={{borderRadius:"8px 0 0 8px"}}>{(g.fecha||"").slice(0,10)}</td>
                          <td>{g.desc}</td>
                          <td><span style={{background:"#0f1117",padding:"3px 10px",borderRadius:20,fontSize:12}}>{g.rubro}</span></td>
                          <td><span style={{color:g.metodo==="Transferencia"?"#2dd4bf":"#f472b6",fontWeight:600}}>{g.metodo}</span></td>
                          <td style={{textAlign:"right",fontWeight:600}}>{fmt(g.monto)}</td>
                          <td style={{textAlign:"center",borderRadius:"0 8px 8px 0"}}>
                            {g.esOriginal!==false && <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                              <EditBtn onClick={function(){openEditGasto(gastos.find(function(x){return x.id===g.id}))}}/>
                              <DeleteBtn onClick={function(){deleteGasto(g.id)}}/>
                            </div>}
                          </td>
                        </tr>;
                      })}
                    </tbody>
                  </table>
                </div>
          }
          <Card style={{marginTop:16}}>
            <h4 style={{margin:"0 0 10px",fontSize:14,color:"#6b7280"}}>Resumen del mes</h4>
            <div style={{display:"flex",gap:24,flexWrap:"wrap",fontSize:14}}>
              <div><span style={{color:"#6b7280"}}>Total{filtroRubro?" ("+filtroRubro+")":""}: </span><strong style={{color:"#f87171"}}>{fmt(totalFiltrado)}</strong></div>
              {filtroRubro && <div><span style={{color:"#6b7280"}}>Total mes completo: </span><strong style={{color:"#f87171"}}>{fmt(totalGastosMes)}</strong></div>}
              <div><span style={{color:"#6b7280"}}>Operaciones: </span><strong>{gastosFiltrados.length}{filtroRubro?" / "+gastosMes.length:""}</strong></div>
            </div>
          </Card>
        </div>;
      }()}

      {/* INGRESOS */}
      {tab==="Ingresos" && <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
          <h3 style={{margin:0,fontSize:16}}>Ingresos — {monthLabel(selMonth)}</h3>
          <PrimaryBtn onClick={openAddIngreso}>+ Nuevo Ingreso</PrimaryBtn>
        </div>

        {ingresosMes.length===0
          ? <Card><div style={{textAlign:"center",color:"#6b7280",padding:30}}>No hay ingresos registrados para este mes.</div></Card>
          : <div style={{overflowX:"auto"}}>
              <table>
                <thead><tr>
                  <th>Fecha</th><th>Descripción</th><th>Miembro</th><th style={{textAlign:"right"}}>Monto</th><th style={{textAlign:"center"}}>Acciones</th>
                </tr></thead>
                <tbody>
                  {ingresosMes.map(function(ing,i){
                    return <tr key={ing.id} style={{background:i%2===0?"#1a1d27":"transparent"}}>
                      <td style={{borderRadius:"8px 0 0 8px"}}>{ing.fecha}</td>
                      <td>{ing.desc}</td>
                      <td><span style={{background:"#0f1117",padding:"3px 10px",borderRadius:20,fontSize:12}}>{ing.member}</span></td>
                      <td style={{textAlign:"right",fontWeight:600,color:"#4ade80"}}>{fmt(ing.monto)}</td>
                      <td style={{textAlign:"center",borderRadius:"0 8px 8px 0"}}>
                        <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                          <EditBtn onClick={function(){openEditIngreso(ing)}}/>
                          <DeleteBtn onClick={function(){deleteIngreso(ing.id)}}/>
                        </div>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
        }
        <Card style={{marginTop:16}}>
          <h4 style={{margin:"0 0 10px",fontSize:14,color:"#6b7280"}}>Resumen del mes</h4>
          <div style={{display:"flex",gap:24,flexWrap:"wrap",fontSize:14}}>
            <div><span style={{color:"#6b7280"}}>Total ingresos: </span><strong style={{color:"#4ade80"}}>{fmt(totalIngresosMes)}</strong></div>
            <div><span style={{color:"#6b7280"}}>Aportes: </span><strong>{ingresosMes.length}</strong></div>
          </div>
        </Card>
      </div>}

      {/* TARJETAS */}
      {tab==="Tarjetas" && function(){
        var comprasFiltradas=comprasMesTarjeta.slice().sort(function(a,b){return b.fecha.localeCompare(a.fecha)});
        var totalMesTarjeta=comprasFiltradas.reduce(function(s,c){return s+c.monto},0);
        var porTarjetaMap={};
        comprasFiltradas.forEach(function(c){porTarjetaMap[c.tarjeta]=(porTarjetaMap[c.tarjeta]||0)+c.monto});
        var porTarjetaArr=Object.entries(porTarjetaMap).sort(function(a,b){return b[1]-a[1]});
        var comprasActivas=comprasConEstado.filter(function(c){return c.estado!=="Finalizada"});

        // Conciliación: lo pagado en Gastos vs. lo que explica cada resumen del período
        var conciliacion=tarjetas.filter(function(t){return t.nombre!=="Sin asignar"}).map(function(t){
          var pagos=pagosTarjeta.filter(function(p){return p.tarjeta===t.nombre&&p.periodo===selMonthTarjeta});
          var pagado=pagos.reduce(function(s,p){return s+p.monto},0);
          var cuotas=comprasExpandidas.filter(function(c){return c.tarjeta===t.nombre&&c.mes===selMonthTarjeta}).reduce(function(s,c){return s+c.monto},0);
          var res=resumenes[resumenId(t.nombre,selMonthTarjeta)]||null;
          var porTipo={};
          if(res)(res.items||[]).filter(function(it){return it.moneda==="ARS"&&it.tipo!=="pago"}).forEach(function(it){porTipo[it.tipo]=(porTipo[it.tipo]||0)+it.monto});
          var explicado=res?res.total:cuotas;
          return {tarjeta:t.nombre,pagos:pagos,pagado:pagado,cuotas:cuotas,res:res,porTipo:porTipo,sinIdentificar:pagado-explicado};
        });
        var pagosSinTarjeta=pagosTarjeta.filter(function(p){return !p.tarjeta});
        var comprasSinAsignar=compras.filter(function(c){return c.tarjeta==="Sin asignar"}).length;

        return <div>
          <input type="file" accept="application/pdf" multiple ref={pdfInputRef} onChange={onPdfElegido} style={{display:"none"}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
            <h3 style={{margin:0,fontSize:16,color:"#818cf8",display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:18}}>💳</span> Tarjetas de Crédito</h3>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <SecondaryBtn onClick={function(){setShowTarjetas(true)}} style={{borderColor:"#818cf8",color:"#818cf8"}}>✎ Tarjetas</SecondaryBtn>
              <PrimaryBtn onClick={openAddCompra} style={{background:"#818cf8"}}>+ Nueva Compra</PrimaryBtn>
            </div>
          </div>

          <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:20}}>
            <StatCard label="Compras activas" value={comprasActivas.length} color="#818cf8" sub={comprasConEstado.length+" compras totales"}/>
            <StatCard label={"Total cuotas — "+monthLabel(selMonthTarjeta)} value={fmt(totalMesTarjeta)} color="#f87171" sub={comprasFiltradas.length+" cuota(s)"}/>
          </div>

          {/* Conciliación de resúmenes */}
          <Card style={{marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:6,flexWrap:"wrap"}}>
              <h4 style={{margin:0,fontSize:14,color:"#6b7280"}}>Conciliación de resúmenes — cierre de</h4>
              <SelectInput value={selMonthTarjeta} onChange={setSelMonthTarjeta} options={availableMonthsTarjeta} style={{minWidth:140}}/>
              <span style={{fontSize:15,fontWeight:700}}>{monthLabel(selMonthTarjeta)}</span>
              <PrimaryBtn onClick={function(){subirResumen(null,selMonthTarjeta)}} style={{background:"#818cf8",marginLeft:"auto",padding:"8px 16px",fontSize:13}}>📄 Subir resúmenes (PDF)</PrimaryBtn>
            </div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:14}}>Compara lo que pagaste (gastos del rubro "{RUBRO_TC}") con lo que explica cada resumen. Podés elegir varios PDF juntos: se leen al mismo tiempo y la app detecta de qué tarjeta es cada uno.</div>

            {cola.length>0 && <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
              {cola.map(function(x){
                var seg=x.inicio?Math.floor((Date.now()-x.inicio)/1000):0;
                return <div key={x.id} style={{display:"flex",alignItems:"center",gap:10,background:"#0f1117",borderRadius:8,padding:"8px 12px",fontSize:13}}>
                  {x.estado==="leyendo" && <span className="spinner"></span>}
                  {x.estado==="listo" && <span style={{color:"#4ade80"}}>✓</span>}
                  {x.estado==="error" && <span style={{color:"#f87171"}}>✕</span>}
                  <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.archivo}</span>
                  {x.estado==="leyendo" && <span style={{color:"#818cf8"}}>Leyendo con IA… {seg}s</span>}
                  {x.estado==="listo" && <span style={{color:"#4ade80"}}>Listo, esperando revisión</span>}
                  {x.estado==="error" && <span style={{color:"#f87171"}}>{x.error}</span>}
                  {x.estado==="error" && <button onClick={function(){setCola(function(c){return c.filter(function(y){return y.id!==x.id})})}} style={{background:"none",border:"none",color:"#6b7280",cursor:"pointer"}}>✕</button>}
                </div>;
              })}
            </div>}
            <div style={{overflowX:"auto"}}>
              <table>
                <thead><tr>
                  <th>Tarjeta</th><th style={{textAlign:"right"}}>Pagado</th><th style={{textAlign:"right"}}>Cuotas cargadas</th><th>Resumen</th><th style={{textAlign:"right"}}>Sin identificar</th><th style={{textAlign:"center"}}>PDF</th>
                </tr></thead>
                <tbody>
                  {conciliacion.map(function(c,i){
                    var colorSin=c.pagado===0?"#6b7280":Math.abs(c.sinIdentificar)<Math.max(c.pagado*0.03,2000)?"#4ade80":"#facc15";
                    return <tr key={c.tarjeta} style={{background:i%2===0?"#1a1d27":"transparent",verticalAlign:"top"}}>
                      <td style={{borderRadius:"8px 0 0 8px"}}><span style={{background:"#1e1b4b",color:"#818cf8",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600}}>{c.tarjeta}</span></td>
                      <td style={{textAlign:"right",fontWeight:600}}>
                        {c.pagado>0?fmt(c.pagado):<span style={{color:"#6b7280",fontWeight:400}}>Sin pago</span>}
                        {c.pagos.some(function(p){return p.autodetectado}) && <div style={{fontSize:11,color:"#6b7280",fontWeight:400}}>detectado por descripción</div>}
                      </td>
                      <td style={{textAlign:"right"}}>{fmt(c.cuotas)}</td>
                      <td style={{fontSize:12}}>
                        {c.res
                          ? <div>
                              <div style={{fontWeight:700,fontSize:13}}>{fmt(c.res.total)}{c.res.totalUSD>0?" + "+fmtUSD(c.res.totalUSD):""}</div>
                              {TIPOS_ITEM.filter(function(t){return c.porTipo[t]}).map(function(t){return <div key={t} style={{color:"#9ca3af"}}>{TIPO_LABEL[t]}: {fmt(c.porTipo[t])}</div>})}
                            </div>
                          : <span style={{color:"#6b7280"}}>Sin cargar</span>}
                      </td>
                      <td style={{textAlign:"right",fontWeight:700,color:colorSin}}>{c.pagado>0?fmt(c.sinIdentificar):"—"}</td>
                      <td style={{textAlign:"center",borderRadius:"0 8px 8px 0",whiteSpace:"nowrap"}}>
                        <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                          {c.res && <SecondaryBtn onClick={function(){setVerResumen(c.res)}} style={{padding:"4px 10px",fontSize:12,borderColor:"#818cf8",color:"#818cf8"}}>Ver</SecondaryBtn>}
                          <SecondaryBtn onClick={function(){subirResumen(c.tarjeta,selMonthTarjeta)}} style={{padding:"4px 10px",fontSize:12,borderColor:"#818cf8",color:"#818cf8"}}>📄 {c.res?"Reemplazar":"Subir"}</SecondaryBtn>
                        </div>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
            {pagosSinTarjeta.length>0 && <div style={{marginTop:12,fontSize:12,color:"#facc15"}}>⚠ {pagosSinTarjeta.length} pago(s) de tarjeta sin tarjeta identificada ({pagosSinTarjeta.map(function(p){return p.desc}).join(", ")}). Editalos en Gastos y elegí la tarjeta.</div>}
            {comprasSinAsignar>0 && <div style={{marginTop:6,fontSize:12,color:"#facc15"}}>⚠ {comprasSinAsignar} compra(s) en cuotas con tarjeta "Sin asignar": no entran en la conciliación hasta que les asignes la tarjeta.</div>}
          </Card>

          {/* Resumen por mes con buscador */}
          <Card style={{marginBottom:20}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,flexWrap:"wrap"}}>
              <h4 style={{margin:0,fontSize:14,color:"#6b7280"}}>Resumen por mes (lo que debería figurar en el resumen)</h4>
              <span style={{fontSize:13,color:"#6b7280"}}>Mes:</span>
              <SelectInput value={selMonthTarjeta} onChange={setSelMonthTarjeta} options={availableMonthsTarjeta} style={{minWidth:140}}/>
              <span style={{fontSize:15,fontWeight:700}}>{monthLabel(selMonthTarjeta)}</span>
            </div>

            {porTarjetaArr.length>0 && <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
              {porTarjetaArr.map(function(entry){
                return <div key={entry[0]} style={{background:"#0f1117",borderRadius:10,padding:"10px 14px",minWidth:150}}>
                  <div style={{fontSize:12,color:"#6b7280"}}>{entry[0]}</div>
                  <div style={{fontSize:16,fontWeight:700,color:"#818cf8"}}>{fmt(entry[1])}</div>
                </div>;
              })}
            </div>}

            {comprasFiltradas.length===0
              ? <div style={{textAlign:"center",color:"#6b7280",padding:20}}>No hay cuotas de tarjeta para {monthLabel(selMonthTarjeta)}.</div>
              : <div style={{overflowX:"auto"}}>
                  <table>
                    <thead><tr>
                      <th>Tarjeta</th><th>Descripción</th><th style={{textAlign:"center"}}>Cuota</th><th style={{textAlign:"right"}}>Monto cuota</th><th style={{textAlign:"center"}}>Acciones</th>
                    </tr></thead>
                    <tbody>
                      {comprasFiltradas.map(function(c,i){
                        return <tr key={c.id} style={{background:i%2===0?"#1a1d27":"transparent"}}>
                          <td style={{borderRadius:"8px 0 0 8px"}}><span style={{background:"#1e1b4b",color:"#818cf8",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600}}>{c.tarjeta}</span></td>
                          <td>{c.desc}</td>
                          <td style={{textAlign:"center"}}>{c.cuotaNum}/{c.cuotasTotal}</td>
                          <td style={{textAlign:"right",fontWeight:600}}>{fmt(c.monto)}</td>
                          <td style={{textAlign:"center",borderRadius:"0 8px 8px 0"}}>
                            <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                              <EditBtn onClick={function(){openEditCompra(compras.find(function(x){return x.id===c.id}))}}/>
                              <DeleteBtn onClick={function(){deleteCompra(c.id)}}/>
                            </div>
                          </td>
                        </tr>;
                      })}
                    </tbody>
                  </table>
                </div>
            }
            <div style={{marginTop:14,fontSize:14}}>
              <span style={{color:"#6b7280"}}>Total {monthLabel(selMonthTarjeta)}: </span><strong style={{color:"#f87171"}}>{fmt(totalMesTarjeta)}</strong>
            </div>
          </Card>

          {/* Control de todas las compras y cuotas restantes */}
          <h4 style={{margin:"0 0 12px",fontSize:14,color:"#6b7280"}}>Todas las compras — control de cuotas</h4>
          {comprasConEstado.length===0
            ? <Card><div style={{textAlign:"center",color:"#6b7280",padding:30}}>No hay compras con tarjeta registradas todavía.</div></Card>
            : <div style={{overflowX:"auto"}}>
                <table>
                  <thead><tr>
                    <th>Tarjeta</th><th>Descripción</th><th>1ª cuota</th><th style={{textAlign:"right"}}>Monto total</th><th style={{textAlign:"right"}}>Monto cuota</th><th style={{textAlign:"center"}}>Cuotas</th><th style={{textAlign:"center"}}>Pagadas</th><th style={{textAlign:"center"}}>Restantes</th><th style={{textAlign:"center"}}>Estado</th><th style={{textAlign:"center"}}>Acciones</th>
                  </tr></thead>
                  <tbody>
                    {comprasConEstado.map(function(c,i){
                      return <tr key={c.id} style={{background:i%2===0?"#1a1d27":"transparent"}}>
                        <td style={{borderRadius:"8px 0 0 8px"}}><span style={{background:"#1e1b4b",color:"#818cf8",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600}}>{c.tarjeta}</span></td>
                        <td>{c.desc}</td>
                        <td>{(c.fecha||"").slice(0,10)}</td>
                        <td style={{textAlign:"right",fontWeight:600}}>{fmt(c.monto)}</td>
                        <td style={{textAlign:"right"}}>{fmt(c.montoCuota)}</td>
                        <td style={{textAlign:"center"}}>{c.cuotas}</td>
                        <td style={{textAlign:"center"}}>{c.pagadas}</td>
                        <td style={{textAlign:"center",fontWeight:700,color:c.restantes>0?"#facc15":"#4ade80"}}>{c.restantes}</td>
                        <td style={{textAlign:"center"}}>
                          <span style={{color:c.estado==="Finalizada"?"#4ade80":c.estado==="Próxima"?"#6b7280":"#818cf8",fontWeight:600,fontSize:12}}>{c.estado}</span>
                        </td>
                        <td style={{textAlign:"center",borderRadius:"0 8px 8px 0"}}>
                          <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                            <EditBtn onClick={function(){openEditCompra(c)}}/>
                            <DeleteBtn onClick={function(){deleteCompra(c.id)}}/>
                          </div>
                        </td>
                      </tr>;
                    })}
                  </tbody>
                </table>
              </div>
          }
        </div>;
      }()}

      {/* PANEL USD */}
      {tab==="Panel USD" && <div>

        {/* Resumen rápido */}
        <div style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:24}}>
          <StatCard label="Ahorros totales" value={fmtUSD(totalAhorrosUSD)} color="#facc15" sub={"Banco "+fmtUSD(ahorrosBanco)+" · Caja "+fmtUSD(ahorrosCaja)}/>
          <StatCard label="Gastos en USD" value={fmtUSD(totalGastosUSD)} color="#fb923c" sub={gastosUSD.length+" operaciones"}/>
          <StatCard label="Saldo neto USD" value={fmtUSD(balanceNetoUSD)} color={balanceNetoUSD>=0?"#4ade80":"#f87171"} sub={balanceNetoUSD>=0?"Positivo":"Negativo"}/>
        </div>

        {/* SECCIÓN AHORROS */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <h3 style={{margin:0,fontSize:15,color:"#facc15",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:18}}>🏦</span> Ahorros en USD
          </h3>
          <PrimaryBtn onClick={openAddAhorro} style={{background:"#facc15",color:"#1a1d27",padding:"8px 16px",fontSize:13}}>+ Nuevo Ahorro</PrimaryBtn>
        </div>

        {ahorros.length===0
          ? <Card style={{marginBottom:20}}><div style={{textAlign:"center",color:"#6b7280",padding:20}}>No hay ahorros registrados aún.</div></Card>
          : <div style={{overflowX:"auto",marginBottom:20}}>
              <table>
                <thead><tr>
                  <th>Fecha</th><th>Descripción</th><th>Ubicación</th><th style={{textAlign:"right"}}>Monto</th><th style={{textAlign:"center"}}>Acciones</th>
                </tr></thead>
                <tbody>
                  {ahorros.slice().sort(function(a,b){return b.fecha.localeCompare(a.fecha)}).map(function(a,i){
                    return <tr key={a.id} style={{background:i%2===0?"#1a1d27":"transparent"}}>
                      <td style={{borderRadius:"8px 0 0 8px"}}>{(a.fecha||"").slice(0,10)}</td>
                      <td>{a.desc}</td>
                      <td>
                        <span style={{background:a.ubicacion==="Banco"?"#1e3a5f":"#2d1b69",color:a.ubicacion==="Banco"?"#38bdf8":"#c084fc",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:600}}>
                          {a.ubicacion==="Banco"?"🏦 Banco":"🔒 Caja de Seguridad"}
                        </span>
                      </td>
                      <td style={{textAlign:"right",fontWeight:700,color:"#facc15",fontFamily:"'Space Mono',monospace"}}>{fmtUSD(a.monto)}</td>
                      <td style={{textAlign:"center",borderRadius:"0 8px 8px 0"}}>
                        <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                          <EditBtn onClick={function(){openEditAhorro(a)}}/>
                          <DeleteBtn onClick={function(){deleteAhorro(a.id)}}/>
                        </div>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
        }

        {/* SECCIÓN GASTOS USD */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8,marginTop:8}}>
          <h3 style={{margin:0,fontSize:15,color:"#fb923c",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:18}}>💸</span> Gastos en USD
          </h3>
          <PrimaryBtn onClick={openAddGastoUSD} style={{background:"#fb923c",color:"#fff",padding:"8px 16px",fontSize:13}}>+ Nuevo Gasto USD</PrimaryBtn>
        </div>

        {gastosUSD.length===0
          ? <Card style={{marginBottom:20}}><div style={{textAlign:"center",color:"#6b7280",padding:20}}>No hay gastos en USD registrados aún.</div></Card>
          : <div style={{overflowX:"auto",marginBottom:20}}>
              <table>
                <thead><tr>
                  <th>Fecha</th><th>Descripción</th><th>Rubro</th><th style={{textAlign:"right"}}>Monto</th><th style={{textAlign:"center"}}>Acciones</th>
                </tr></thead>
                <tbody>
                  {gastosUSD.slice().sort(function(a,b){return b.fecha.localeCompare(a.fecha)}).map(function(g,i){
                    return <tr key={g.id} style={{background:i%2===0?"#1a1d27":"transparent"}}>
                      <td style={{borderRadius:"8px 0 0 8px"}}>{(g.fecha||"").slice(0,10)}</td>
                      <td>{g.desc}</td>
                      <td><span style={{background:"#0f1117",padding:"3px 10px",borderRadius:20,fontSize:12}}>{g.rubro}</span></td>
                      <td style={{textAlign:"right",fontWeight:700,color:"#fb923c",fontFamily:"'Space Mono',monospace"}}>{fmtUSD(g.monto)}</td>
                      <td style={{textAlign:"center",borderRadius:"0 8px 8px 0"}}>
                        <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                          <EditBtn onClick={function(){openEditGastoUSD(g)}}/>
                          <DeleteBtn onClick={function(){deleteGastoUSD(g.id)}}/>
                        </div>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
        }

        {/* Gráfico distribución gastos USD por rubro */}
        {gastosPorRubroUSD.length>0 && <Card>
          <h4 style={{margin:"0 0 12px",fontSize:14,color:"#6b7280"}}>Gastos USD por Rubro</h4>
          <ResponsiveContainer width="100%" height={220}>
            <PieChart>
              <Pie data={gastosPorRubroUSD.map(function(r){return{name:r[0],value:r[1]}})} cx="50%" cy="50%" outerRadius={80} innerRadius={40} dataKey="value" paddingAngle={2}
                label={function(p){return p.name+" "+Math.round(p.percent*100)+"%"}} style={{fontSize:11}}>
                {gastosPorRubroUSD.map(function(_,i){return <Cell key={i} fill={COLORS[i%COLORS.length]}/>})}
              </Pie>
              <Tooltip formatter={function(v){return fmtUSD(v)}} {...ttStyle}/>
            </PieChart>
          </ResponsiveContainer>
        </Card>}

      </div>}

      </div>

      {/* MODALS */}
      <Modal open={showGasto} onClose={function(){setShowGasto(false);resetGastoForm()}} title={editGasto?"Editar Gasto":"Nuevo Gasto"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Descripción</label><TextInput value={gDesc} onChange={setGDesc} placeholder="Ej: Compra supermercado"/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Monto total ($)</label><TextInput type="number" value={gMonto} onChange={setGMonto} placeholder="0" min="0"/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Rubro</label><SelectInput value={gRubro} onChange={setGRubro} options={rubros} placeholder="Seleccionar rubro" style={{width:"100%"}}/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Medio de pago</label><SelectInput value={gMetodo} onChange={setGMetodo} options={PAYMENT_METHODS} style={{width:"100%"}}/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Fecha</label><TextInput type="date" value={gFecha} onChange={setGFecha}/></div>
          {gRubro===RUBRO_TC && <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>¿Qué tarjeta pagaste?</label>
            <SelectInput value={gTarjeta} onChange={setGTarjeta} options={tarjetas.filter(function(t){return t.nombre!=="Sin asignar"}).map(function(t){return t.nombre})} placeholder="Seleccionar tarjeta" style={{width:"100%"}}/>
            {gTarjeta && gFecha && <div style={{fontSize:12,color:"#818cf8",marginTop:4}}>Paga el resumen con cierre en {monthLabel(periodoPagado(gFecha,(tarjetas.find(function(t){return t.nombre===gTarjeta})||{}).cierre||1))}</div>}
          </div>}
          <PrimaryBtn onClick={saveGasto} disabled={!gDesc||!gMonto||!gRubro} style={{marginTop:8}}>{editGasto?"Guardar cambios":"Registrar gasto"}</PrimaryBtn>
        </div>
      </Modal>

      <Modal open={showIngreso} onClose={function(){setShowIngreso(false);resetIngresoForm()}} title={editIngreso?"Editar Ingreso":"Nuevo Ingreso"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Descripción</label><TextInput value={iDesc} onChange={setIDesc} placeholder="Ej: Sueldo mayo"/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Monto ($)</label><TextInput type="number" value={iMonto} onChange={setIMonto} placeholder="0" min="0"/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Miembro</label><SelectInput value={iMember} onChange={setIMember} options={members} placeholder="Seleccionar miembro" style={{width:"100%"}}/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Fecha</label><TextInput type="date" value={iFecha} onChange={setIFecha}/></div>
          <PrimaryBtn onClick={saveIngreso} disabled={!iDesc||!iMonto||!iMember} style={{marginTop:8}}>{editIngreso?"Guardar cambios":"Registrar ingreso"}</PrimaryBtn>
        </div>
      </Modal>

      <Modal open={showRubros} onClose={function(){setShowRubros(false)}} title="Editar Rubros">
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {rubros.map(function(r){return <div key={r} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#0f1117",borderRadius:8}}>
            <span style={{fontSize:14}}>{r}</span>
            <DeleteBtn onClick={function(){removeRubro(r)}}/>
          </div>})}
        </div>
        <div style={{display:"flex",gap:8}}>
          <TextInput value={newRubro} onChange={setNewRubro} placeholder="Nuevo rubro..." style={{flex:1}}/>
          <PrimaryBtn onClick={addRubro} disabled={!newRubro.trim()}>Agregar</PrimaryBtn>
        </div>
      </Modal>

      <Modal open={showGastoUSD} onClose={function(){setShowGastoUSD(false);resetGastoUSDForm()}} title={editGastoUSD?"Editar Gasto USD":"Nuevo Gasto en USD"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Descripción</label><TextInput value={guDesc} onChange={setGuDesc} placeholder="Ej: Cena restaurante, electrónica..."/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Monto (USD)</label><TextInput type="number" value={guMonto} onChange={setGuMonto} placeholder="0.00" min="0"/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Rubro</label><SelectInput value={guRubro} onChange={setGuRubro} options={rubros} placeholder="Seleccionar rubro" style={{width:"100%"}}/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Fecha</label><TextInput type="date" value={guFecha} onChange={setGuFecha}/></div>
          <PrimaryBtn onClick={saveGastoUSD} disabled={!guDesc||!guMonto||!guRubro} style={{marginTop:8,background:"#fb923c"}}>{editGastoUSD?"Guardar cambios":"Registrar gasto USD"}</PrimaryBtn>
        </div>
      </Modal>

      <Modal open={showAhorro} onClose={function(){setShowAhorro(false);resetAhorroForm()}} title={editAhorro?"Editar Ahorro USD":"Nuevo Ahorro USD"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Descripción</label><TextInput value={aDesc} onChange={setADesc} placeholder="Ej: Ahorro dólares billete"/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Monto (USD)</label><TextInput type="number" value={aMonto} onChange={setAMonto} placeholder="0.00" min="0"/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Ubicación</label>
            <SelectInput value={aUbicacion} onChange={setAUbicacion} options={UBICACIONES} style={{width:"100%"}}/>
          </div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Fecha</label><TextInput type="date" value={aFecha} onChange={setAFecha}/></div>
          <PrimaryBtn onClick={saveAhorro} disabled={!aDesc||!aMonto} style={{marginTop:8,background:"#facc15",color:"#1a1d27"}}>{editAhorro?"Guardar cambios":"Registrar ahorro"}</PrimaryBtn>
        </div>
      </Modal>

      <Modal open={showMembers} onClose={function(){setShowMembers(false)}} title="Editar Miembros">
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {members.map(function(m){return <div key={m} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#0f1117",borderRadius:8}}>
            <span style={{fontSize:14}}>{m}</span>
            <DeleteBtn onClick={function(){removeMember(m)}}/>
          </div>})}
        </div>
        <div style={{display:"flex",gap:8}}>
          <TextInput value={newMember} onChange={setNewMember} placeholder="Nuevo miembro..." style={{flex:1}}/>
          <PrimaryBtn onClick={addMember} disabled={!newMember.trim()}>Agregar</PrimaryBtn>
        </div>
      </Modal>

      <Modal open={showTarjetas} onClose={function(){setShowTarjetas(false)}} title="Editar Tarjetas">
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {tarjetas.map(function(t){return <div key={t.nombre} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",background:"#0f1117",borderRadius:8}}>
            <span style={{fontSize:14}}>{t.nombre} <span style={{color:"#6b7280",fontSize:12}}>— cierre día {t.cierre}</span></span>
            <DeleteBtn onClick={function(){removeTarjeta(t.nombre)}}/>
          </div>})}
        </div>
        <div style={{fontSize:12,color:"#6b7280",marginBottom:8}}>El día de cierre se declara una sola vez: con eso calculamos automáticamente en qué mes cae la primera cuota de cada compra nueva.</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <TextInput value={newTarjeta} onChange={setNewTarjeta} placeholder="Ej: Visa Banco X, Mastercard..." style={{flex:2,minWidth:160}}/>
          <TextInput type="number" value={newTarjetaCierre} onChange={setNewTarjetaCierre} placeholder="Día cierre" min="1" style={{flex:1,minWidth:100}}/>
          <PrimaryBtn onClick={addTarjeta} disabled={!newTarjeta.trim()||!newTarjetaCierre} style={{background:"#818cf8"}}>Agregar</PrimaryBtn>
        </div>
      </Modal>

      <Modal open={showCompra} onClose={function(){setShowCompra(false);resetCompraForm()}} title={editCompra?"Editar Compra":"Nueva Compra con Tarjeta"}>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Descripción</label><TextInput value={cDesc} onChange={setCDesc} placeholder="Ej: Notebook, electrodoméstico..."/></div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Monto total ($)</label><TextInput type="number" value={cMonto} onChange={setCMonto} placeholder="0" min="0"/></div>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Tarjeta</label>
            {tarjetas.length===0
              ? <div style={{fontSize:13,color:"#f87171"}}>Primero agregá una tarjeta con "✎ Tarjetas".</div>
              : <SelectInput value={cTarjeta} onChange={setCTarjeta} options={tarjetas.map(function(t){return t.nombre})} placeholder="Seleccionar tarjeta" style={{width:"100%"}}/>
            }
          </div>
          <div><label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Rubro</label><SelectInput value={cRubro} onChange={setCRubro} options={rubros} placeholder="Sin rubro" style={{width:"100%"}}/></div>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Cuotas</label>
            <TextInput type="number" value={cCuotas} onChange={setCCuotas} min="1" placeholder="1"/>
            {parseInt(cCuotas)>1 && cMonto && <div style={{fontSize:12,color:"#818cf8",marginTop:4}}>Cuota mensual: {fmt(parseFloat(cMonto)/parseInt(cCuotas))}</div>}
          </div>
          <div>
            <label style={{fontSize:12,color:"#6b7280",display:"block",marginBottom:4}}>Fecha de compra</label>
            <TextInput type="date" value={cFechaCompra} onChange={setCFechaCompra}/>
            {cTarjeta && cFechaCompra && function(){
              var cierreSel=(tarjetas.find(function(t){return t.nombre===cTarjeta})||{}).cierre||1;
              var primeraCuota=calcularPrimeraCuota(cFechaCompra,cierreSel);
              return <div style={{fontSize:12,color:"#818cf8",marginTop:4}}>1ª cuota: {monthLabel(monthKey(primeraCuota))} (según cierre día {cierreSel})</div>;
            }()}
          </div>
          <PrimaryBtn onClick={saveCompra} disabled={!cDesc||!cMonto||!cTarjeta} style={{marginTop:8,background:"#818cf8"}}>{editCompra?"Guardar cambios":"Registrar compra"}</PrimaryBtn>
        </div>
      </Modal>

      {/* Revisión de lo extraído del PDF antes de guardar */}
      <Modal open={!!revision} wide onClose={function(){if(confirm("¿Descartar lo leído del resumen?"))setRevision(null)}} title={revision?"Revisar resumen — cierre "+monthLabel(revision.periodo):""}>
        {revision && function(){
          var lineas=revision.items.filter(function(it){return it.moneda==="ARS"&&it.tipo!=="pago"});
          var sumaLineas=lineas.reduce(function(s,it){return s+it.monto},0);
          var difTotal=revision.total-sumaLineas;
          var nuevas=revision.items.filter(function(it){return it.agregarCompra}).length;
          var pendientes=cola.filter(function(x){return x.estado!=="error"}).length;
          return <div>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:12,fontSize:13}}>
              <span style={{color:"#6b7280"}}>Archivo: {revision.archivo}</span>
              <span style={{color:"#6b7280",marginLeft:8}}>Tarjeta:</span>
              <SelectInput value={revision.tarjeta} onChange={cambiarTarjetaRevision} options={tarjetas.filter(function(t){return t.nombre!=="Sin asignar"}).map(function(t){return t.nombre})} placeholder="¿De qué tarjeta es?" style={{minWidth:200,borderColor:revision.tarjeta?"#2a2d3a":"#facc15"}}/>
              {pendientes>0 && <span style={{color:"#818cf8",marginLeft:"auto"}}>Quedan {pendientes} resumen(es) más</span>}
            </div>
            <div style={{display:"flex",gap:20,flexWrap:"wrap",fontSize:13,marginBottom:12}}>
              <div><span style={{color:"#6b7280"}}>Cierre: </span>{revision.cierre}</div>
              <div><span style={{color:"#6b7280"}}>Vencimiento: </span>{revision.vencimiento}</div>
              <div><span style={{color:"#6b7280"}}>Total: </span><strong>{fmt(revision.total)}</strong>{revision.totalUSD>0?" + "+fmtUSD(revision.totalUSD):""}</div>
              <div><span style={{color:"#6b7280"}}>Suma de líneas: </span><strong style={{color:Math.abs(difTotal)<Math.max(revision.total*0.01,500)?"#4ade80":"#facc15"}}>{fmt(sumaLineas)}</strong></div>
            </div>
            {Math.abs(difTotal)>=Math.max(revision.total*0.01,500) && <div style={{fontSize:12,color:"#facc15",marginBottom:10}}>⚠ La suma de las líneas no coincide con el total del resumen (diferencia {fmt(difTotal)}). Revisá si falta alguna línea o si hay un pago mal clasificado.</div>}
            {revision.notas && <div style={{fontSize:12,color:"#9ca3af",marginBottom:10}}>Nota de la IA: {revision.notas}</div>}
            <div style={{fontSize:12,color:"#6b7280",marginBottom:8}}>Revisá el tipo y el rubro de cada línea. Las cuotas que no están cargadas en la app se pueden agregar a "Todas las compras" marcando la casilla.</div>
            <div style={{overflowX:"auto",maxHeight:"50vh",overflowY:"auto"}}>
              <table style={{fontSize:12}}>
                <thead><tr><th>Fecha</th><th>Descripción</th><th style={{textAlign:"right"}}>Monto</th><th>Tipo</th><th>Rubro</th><th>Cuota</th></tr></thead>
                <tbody>
                  {revision.items.map(function(it,i){
                    return <tr key={it.key} style={{background:i%2===0?"#22252f":"transparent",opacity:it.tipo==="pago"?0.5:1}}>
                      <td style={{whiteSpace:"nowrap",padding:"6px 8px"}}>{it.fecha}</td>
                      <td style={{padding:"6px 8px"}}>{it.desc}{it.titular && <div style={{color:"#6b7280"}}>{it.titular}</div>}</td>
                      <td style={{textAlign:"right",fontWeight:600,whiteSpace:"nowrap",padding:"6px 8px",color:it.monto<0?"#4ade80":"#e8eaed"}}>{it.moneda==="USD"?fmtUSD(it.monto):fmt(it.monto)}</td>
                      <td style={{padding:"6px 8px"}}><select value={it.tipo} onChange={function(e){updateItemRevision(it.key,"tipo",e.target.value)}} style={{padding:"4px 6px",borderRadius:6,border:"1px solid #2a2d3a",background:"#0f1117",color:"#e8eaed",fontSize:12}}>
                        {TIPOS_ITEM.map(function(t){return <option key={t} value={t}>{TIPO_LABEL[t]}</option>})}
                      </select></td>
                      <td style={{padding:"6px 8px"}}><select value={it.rubro} onChange={function(e){updateItemRevision(it.key,"rubro",e.target.value)}} style={{padding:"4px 6px",borderRadius:6,border:"1px solid #2a2d3a",background:"#0f1117",color:"#e8eaed",fontSize:12,maxWidth:130}}>
                        {rubros.map(function(r){return <option key={r} value={r}>{r}</option>})}
                      </select></td>
                      <td style={{padding:"6px 8px",whiteSpace:"nowrap"}}>
                        {it.cuota_numero && it.cuotas_total ? it.cuota_numero+"/"+it.cuotas_total : ""}
                        {it.compraExistente && <div style={{color:"#4ade80"}}>✓ ya cargada</div>}
                        {it.tipo==="cuota" && it.cuotas_total>1 && !it.compraExistente && <label style={{display:"flex",alignItems:"center",gap:4,color:"#818cf8",cursor:"pointer"}}>
                          <input type="checkbox" checked={!!it.agregarCompra} onChange={function(e){updateItemRevision(it.key,"agregarCompra",e.target.checked)}}/> agregar
                        </label>}
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:16,flexWrap:"wrap"}}>
              <SecondaryBtn onClick={function(){setRevision(null)}} style={{borderColor:"#6b7280",color:"#6b7280"}}>Descartar</SecondaryBtn>
              <PrimaryBtn onClick={guardarRevision} disabled={!revision.tarjeta} style={{background:revision.tarjeta?"#818cf8":undefined}}>Guardar resumen{nuevas>0?" y agregar "+nuevas+" compra(s)":""}</PrimaryBtn>
            </div>
          </div>;
        }()}
      </Modal>

      {/* Detalle de un resumen ya conciliado */}
      <Modal open={!!verResumen} wide onClose={function(){setVerResumen(null)}} title={verResumen?verResumen.tarjeta+" — cierre "+monthLabel(verResumen.periodo):""}>
        {verResumen && <div>
          <div style={{display:"flex",gap:20,flexWrap:"wrap",fontSize:13,marginBottom:12}}>
            <div><span style={{color:"#6b7280"}}>Cierre: </span>{verResumen.cierre}</div>
            <div><span style={{color:"#6b7280"}}>Vencimiento: </span>{verResumen.vencimiento}</div>
            <div><span style={{color:"#6b7280"}}>Total: </span><strong>{fmt(verResumen.total)}</strong>{verResumen.totalUSD>0?" + "+fmtUSD(verResumen.totalUSD):""}</div>
          </div>
          <div style={{overflowX:"auto",maxHeight:"55vh",overflowY:"auto"}}>
            <table style={{fontSize:12}}>
              <thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Rubro</th><th style={{textAlign:"right"}}>Monto</th></tr></thead>
              <tbody>
                {(verResumen.items||[]).map(function(it,i){
                  return <tr key={i} style={{background:i%2===0?"#22252f":"transparent",opacity:it.tipo==="pago"?0.5:1}}>
                    <td style={{whiteSpace:"nowrap",padding:"6px 8px"}}>{it.fecha}</td>
                    <td style={{padding:"6px 8px"}}>{it.desc}{it.cuota_numero && it.cuotas_total ? " ("+it.cuota_numero+"/"+it.cuotas_total+")" : ""}</td>
                    <td style={{padding:"6px 8px"}}>{TIPO_LABEL[it.tipo]||it.tipo}</td>
                    <td style={{padding:"6px 8px"}}>{it.rubro}</td>
                    <td style={{textAlign:"right",fontWeight:600,whiteSpace:"nowrap",padding:"6px 8px"}}>{it.moneda==="USD"?fmtUSD(it.monto):fmt(it.monto)}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}>
            <SecondaryBtn onClick={function(){borrarResumen(verResumen)}} style={{borderColor:"#f87171",color:"#f87171"}}>Eliminar resumen</SecondaryBtn>
          </div>
        </div>}
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
